<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daftar Kebutuhan Lainnya | BJ-Mart</title>
        <link rel="stylesheet" href="../assets/css/style.css">
    </head>
    <body>
        <header>
            <div class="logo-group">
                <div class="logo">
                    <img src="../img/logo-toko.jpg" alt="Logo BJ-Mart" class="logo-brand">
                    <h1>BerkahJaya-Mart</h1>
                </div>
                <a href="../UTS/uts.html" class="nav-uts">UTS</a>
            </div>

            <button id="nav-toggle-btn" class="nav-toggle-label" type="button">&#9776;</button>
            <nav id="main-nav">
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../kebutuhan-pokok/list.html">Daftar Kebutuhan Pokok</a></li>
                    <li><a href="../makanan-minuman/list.html">Daftar Makanan & Minuman</a></li>
                    <li><a href="list.html">Daftar Kebutuhan Lainnya</a></li>
                    <li><a href="../transaksi/list.html">Riwayat Penjualan</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="header-halaman">
                <h2>Daftar Produk Kebutuhan Lainnya</h2>
                <a href="tambah.html" class="btn-tambah">+ Tambah Produk</a>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Cari nama produk...">
            </div>
            
            <p id="loading-indicator" style="display:none; color: var(--text-muted); font-weight: 600; margin-bottom: 1rem;">Memuat data...</p>
            <p id="info-tampil" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; font-weight: 500;"></p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Harga Satuan</th>
                            <th>Sisa Stok</th>
                            <th>Satuan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-produk" data-json="../data/kebutuhan-lainnya.json">
                        <!-- Data diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BJ-Mart &mdash; Project Dzy</p>
        </footer>
        <script src="../assets/js/app.js"></script>
